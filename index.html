<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Only For U</title>
<meta name="description" content="Untuk kamu — sebuah dunia kecil berisi kenangan kita.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== LOADING SCREEN ===== -->
  <div id="loading" class="loading">
    <div class="loading-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="42" height="42">
        <path fill="currentColor" d="M12 21s-6.7-4.2-9.4-8.3C.8 9.8 1.7 6.1 4.7 4.6c2.6-1.3 5.3-.2 7.3 2 2-2.2 4.7-3.3 7.3-2 3 1.5 3.9 5.2 2.1 8.1C18.7 16.8 12 21 12 21z"/>
      </svg>
    </div>
    <p class="loading-title">Menyiapkan duniamu…</p>
    <div class="loading-bar"><div class="loading-bar-fill" id="loadingFill"></div></div>
    <p class="loading-sub">Sabar ya, sedang menata bintang &amp; kenangan ✨</p>
  </div>

  <!-- ===== 3D CANVAS ===== -->
  <canvas id="scene"></canvas>

  <!-- ===== UI OVERLAY ===== -->
  <div class="ui">
    <div class="ui-hint" id="hint">Geser untuk memutar · Cubit untuk memperbesar</div>
  </div>

  <script type="module" src="main.js?v=3"></script>
</body>
</html>
