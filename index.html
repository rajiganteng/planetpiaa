<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Only For U</title>
<meta name="description" content="Untuk kamu — sebuah dunia kecil berisi kenangan kita.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== GATE / GERBANG ===== -->
  <div id="gate" class="gate">
    <p class="gate-question">Mau lihat cewe tercantik<br>di dunia gak?</p>
    <div class="gate-buttons">
      <button id="gateYes" class="gate-btn gate-yes">mauuu😍</button>
      <button id="gateNo" class="gate-btn gate-no">gakkk mw lahh😒</button>
    </div>
    <p class="gate-taunt" id="gateTaunt">&nbsp;</p>
  </div>

  <!-- ===== LOADING SCREEN ===== -->
  <div id="loading" class="loading">
    <div class="loading-planet" aria-hidden="true">
      <div class="lp-ring"></div>
      <div class="lp-sphere"></div>
      <div class="lp-ring lp-ring-front"></div>
    </div>
    <p class="loading-title">Membangun galaksi kita…</p>
    <div class="loading-bar"><div class="loading-bar-fill" id="loadingFill"></div></div>
    <p class="loading-sub">Sabar ya, sedang menata bintang &amp; kenangan ✨</p>
  </div>

  <!-- ===== 3D CANVAS ===== -->
  <canvas id="scene"></canvas>

  <!-- ===== UI OVERLAY ===== -->
  <div class="ui">
    <div class="ui-hint" id="hint">Geser untuk memutar · Cubit untuk memperbesar</div>
  </div>

  <script type="module" src="main.js?v=4"></script>
</body>
</html>
